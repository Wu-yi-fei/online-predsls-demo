<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Online System-Level Synthesis for Prediction-Adaptive Networked Control. Yifei Wu, Tongxin Li, and Jing Yu.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Online System-Level Synthesis for Prediction-Adaptive Networked Control</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #60646c;
      --link: #0071e3;
      --rule: #c9ccd1;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 1016px);
      margin: 0 auto;
      padding: 48px 28px 64px;
    }
    header { text-align: center; }
    h1 {
      max-width: 920px;
      margin: 0 auto;
      font-size: clamp(27px, 3.1vw, 40px);
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -.6px;
      text-wrap: balance;
    }
    h1 span { white-space: nowrap; }
    a { color: var(--link); text-decoration: none; text-underline-offset: 4px; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 5px; }
    .authors {
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 13px;
      margin: 22px 0 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .authors > span[aria-hidden] { color: #b1b4b9; }
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.5;
    }
    nav a, nav [aria-disabled] { display: inline-flex; align-items: center; min-height: 36px; }
    nav [aria-disabled] { color: #9a9ea5; cursor: default; }
    nav .separator { color: #b8bbc1; }
    hr {
      max-width: 820px;
      height: 0;
      margin: 38px auto;
      border: 0;
      border-top: 1px dashed var(--rule);
    }
    figure { margin: 0; text-align: center; }
    .figure-link { display: block; margin: 0 auto; cursor: zoom-in; }
    .overview .figure-link { max-width: 540px; }
    .update .figure-link { width: 66.6667%; max-width: 453.333px; }
    img { display: block; width: 100%; height: auto; }
    figcaption {
      max-width: 740px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      text-wrap: pretty;
    }
    .math { white-space: nowrap; }
    var { font-family: Georgia, "Times New Roman", serif; }
    .project-footer { display: flex; justify-content: center; margin-top: 36px; }
    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: #35383e;
      background: #f5f5f7;
      transition: background .2s ease, color .2s ease;
    }
    .github-link:hover { background: #eaecef; color: #17191c; }
    .github-link svg { display: block; width: 29px; height: 29px; fill: currentColor; animation: github-float 3.4s ease-in-out infinite; }
    @keyframes github-float {
      0%, 100% { transform: translateY(1px); }
      50% { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .github-link { transition: none; }
      .github-link svg { animation: none; }
    }
    @media (max-width: 600px) {
      main { padding: 32px 20px 44px; }
      h1 { font-size: 29px; line-height: 1.27; letter-spacing: -.45px; }
      .authors { font-size: 14px; gap: 6px 10px; margin-top: 20px; }
      nav { font-size: 16px; margin-top: 16px; gap: 14px; }
      hr { margin: 29px auto; }
      figcaption { margin-top: 16px; font-size: 14px; line-height: 1.6; }
    }
    @media (max-width: 360px) {
      main { padding-inline: 16px; }
      h1 { font-size: 26px; }
      .authors { gap: 5px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Online <span>System-Level</span> Synthesis for <span>Prediction-Adaptive</span> Networked Control</h1>
      <p class="authors">
        <span>Yifei Wu</span>
        <span aria-hidden="true">·</span>
        <a href="https://tongxin.me/" target="_blank" rel="noopener noreferrer">Tongxin Li</a>
        <span aria-hidden="true">·</span>
        <a href="https://jingyu.io/" target="_blank" rel="noopener noreferrer">Jing Yu</a>
      </p>
      <nav aria-label="Paper resources">
        <span role="link" aria-disabled="true">Paper</span>
        <span class="separator" aria-hidden="true">|</span>
        <a href="demo.html">Demo</a>
        <span class="separator" aria-hidden="true">|</span>
        <a href="supplementary_materials.pdf" target="_blank" rel="noopener noreferrer">Materials</a>
      </nav>
    </header>

    <hr>

    <figure class="overview">
      <a class="figure-link" href="assets/paper/method-overview.svg" target="_blank" rel="noopener noreferrer" aria-label="Open the method overview at full size">
        <img src="assets/paper/method-overview.svg" width="740" height="267" alt="Observed data update predictive state and input responses, which shape control actions in the network." fetchpriority="high">
      </a>
      <figcaption>Online learning of predictive closed-loop responses for networked control.</figcaption>
    </figure>

    <hr>

    <figure class="update">
      <a class="figure-link" href="assets/paper/response-update.svg" target="_blank" rel="noopener noreferrer" aria-label="Open the response update diagram at full size">
        <img src="assets/paper/response-update.svg" width="420" height="221" alt="A delayed gradient evaluated at the stored predictive response updates completed matrix rows within the FIR support.">
      </a>
      <figcaption>At time <var>t</var>, delayed gradients update rows <span class="math"><var>ℓ</var> ≤ <var>t</var> − <var>d</var></span> within the Finite Impulse Response (FIR) support.</figcaption>
    </figure>

    <footer class="project-footer">

  </main>
</body>
